packages:
  all:
    require: "%gcc@15.2.0"
  # Bootstrap compiler — unavoidable, needed to build gcc@15.2.0
  gcc:
    externals:
    - spec: gcc@11.5.0 languages:='c,c++'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++

  # Source fetching and unpacking — needed before anything is built
  curl:
    externals:
    - spec: curl@7.76.1+gssapi+ldap+nghttp2
      prefix: /usr
  tar:
    externals:
    - spec: tar@1.34
      prefix: /usr

  # Build systems
  gmake:
    externals:
    - spec: gmake@4.3
      prefix: /usr

  # GCC's build scripts use perl; also needed by GMP/MPFR/MPC build systems
  perl:
    externals:
    - spec: perl@5.32.1~cpanm+opcode+open+shared+threads
      prefix: /usr

  # m4 is required by GMP, MPFR, MPC configure scripts
  m4:
    externals:
    - spec: m4@1.4.19
      prefix: /usr

  # Spack itself is Python — needed before Spack can build anything
  python:
    externals:
    - spec: python@3.9.21+bz2+crypt+ctypes+dbm+lzma+nis+pyexpat+readline+sqlite3+ssl+tkinter+uuid+zlib
      prefix: /usr
